<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online CBT Examination Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-start p-4">

    <div class="w-full max-w-3xl bg-white shadow-xl rounded-2xl p-6 mt-4">
        <h1 class="text-2xl font-bold text-center text-blue-700 mb-1">Online CBT Examination Portal</h1>
        <p id="status-bar" class="text-xs text-center text-gray-500 mb-4">Connecting to database...</p>

        <!-- Admin Panel -->
        <div id="admin-panel" class="mb-6 p-4 bg-blue-50 border border-blue-200 rounded-xl">
            <h2 class="text-md font-semibold text-blue-900 mb-1">Admin Panel: Bulk Question Upload</h2>
            <p class="text-xs text-gray-600 mb-3">Yahan apne questions paste karein. Yeh seedhe Supabase database mein save honge.</p>
            
            <div class="mb-3">
                <input type="text" id="admin-name" placeholder="Student / Admin Name" class="w-full p-2 border rounded text-sm mb-2 outline-none focus:ring-2 focus:ring-blue-400">
                <input type="email" id="admin-email" placeholder="Student Email (Result ke liye)" class="w-full p-2 border rounded text-sm outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <textarea id="bulk-input" rows="5" class="w-full p-3 border rounded text-sm outline-none focus:ring-2 focus:ring-blue-400 mb-3 font-mono" placeholder="Yahan apne questions paste karein (e.g., Q1. What is... A) ... B) ... C) ... D) ... Correct: A)"></textarea>
            
            <div class="flex gap-2 flex-wrap">
                <button onclick="parseAndUploadQuestions()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700 transition">Parse & Upload to DB</button>
                <button onclick="loadQuestionsFromDB()" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-green-700 transition">Refresh Questions</button>
            </div>
        </div>

        <!-- Student Exam Section -->
        <div id="exam-section" class="border p-6 rounded-xl bg-white">
            <div id="exam-container">
                <p class="text-gray-500 text-center">Database se questions load ho rahe hain...</p>
            </div>
        </div>
    </div>

    <!-- Hidden Web3Forms Form for Email Result Dispatch -->
    <form id="result-form" action="https://api.web3forms.com/submit" method="POST" class="hidden">
        <input type="hidden" name="access_key" value="5f6d33ed-57b5-4514-b700-f3217dd3088b">
        <input type="hidden" name="to_email" value="mmulti982@gmail.com">
        <input type="hidden" name="subject" value="New Exam Result Submission - CBT Portal">
        <input type="hidden" name="message" id="form-message-body">
    </form>

    <script>
        // === SUPABASE CREDENTIALS ===
        const SUPABASE_URL = 'https://rpuxwmvdclzupnicqvqz.supabase.co';
        // Yahan apni Supabase ki public anon/publishable key paste karein (jo settings -> API me milti hai)
        const SUPABASE_ANON_KEY = 'Aapki_Supabase_Anon_Key_Yahan_Daalein'; 
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let liveQuestions = [];

        window.addEventListener('DOMContentLoaded', () => {
            loadQuestionsFromDB();
        });

        // 1. Fetch Questions from Supabase DB
        async function loadQuestionsFromDB() {
            const statusBar = document.getElementById('status-bar');
            statusBar.innerText = "Fetching questions from database...";

            const { data, error } = await _supabase
                .from('exam_questions')
                .select('*');

            if (error) {
                console.error('Error fetching:', error);
                statusBar.innerText = "Database connection error! Anon Key check karein.";
                return;
            }

            if (data && data.length > 0) {
                liveQuestions = data;
                statusBar.innerText = `Total ${data.length} questions loaded successfully from database!`;
                renderExamInterface(data);
            } else {
                statusBar.innerText = "Database mein koi question nahi hai. Admin panel se upload karein.";
                document.getElementById('exam-container').innerHTML = `<p class="text-red-500 text-center font-medium">No Questions Available in Database. Please upload above.</p>`;
            }
        }

        // 2. Parse and Upload Questions to Supabase
        async function parseAndUploadQuestions() {
            const rawText = document.getElementById('bulk-input').value.trim();
            if (!rawText) {
                alert('Kripya questions paste karein!');
                return;
            }

            // Simple parser structure
            const newQuestion = {
                question_text: rawText,
                option_a: "Option A",
                option_b: "Option B",
                option_c: "Option C",
                option_d: "Option D",
                correct_answer: "Option A",
                subject: "General CBT"
            };

            const { data, error } = await _supabase
                .from('exam_questions')
                .insert([newQuestion]);

            if (error) {
                alert('Upload fail ho gaya: ' + error.message);
            } else {
                alert('Question successfully Supabase mein save ho gaya!');
                document.getElementById('bulk-input').value = '';
                loadQuestionsFromDB();
            }
        }

        // 3. Render Exam UI for Students
        function renderExamInterface(questions) {
            const container = document.getElementById('exam-container');
            let html = `<h2 class="text-lg font-semibold text-gray-800 mb-4">Exam Questions (Live from Database)</h2>`;
            
            questions.forEach((q, index) => {
                html += `
                    <div class="mb-4 p-4 bg-gray-50 border rounded-lg">
                        <p class="font-medium text-gray-900 mb-2">Q${index + 1}: ${q.question_text}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm">
                            <div class="p-2 bg-white border rounded">A) ${q.option_a}</div>
                            <div class="p-2 bg-white border rounded">B) ${q.option_b}</div>
                            <div class="p-2 bg-white border rounded">C) ${q.option_c}</div>
                            <div class="p-2 bg-white border rounded">D) ${q.option_d}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
