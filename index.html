<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online CBT Examination Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-start p-4">

    <div class="w-full max-w-2xl bg-white shadow-xl rounded-2xl p-6 mt-4">
        <h1 class="text-2xl font-bold text-center text-blue-700 mb-1">Online CBT Examination Portal</h1>
        <p id="status-bar" class="text-xs text-center text-gray-500 mb-4">Connecting to secure database...</p>

        <!-- Mode Toggle -->
        <div class="flex justify-center gap-4 mb-6">
            <button onclick="switchMode('student')" id="btn-student" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold shadow">Student Exam</button>
            <button onclick="switchMode('admin')" id="btn-admin" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-semibold">Admin Panel</button>
        </div>

        <!-- 1. STUDENT SECTION -->
        <div id="student-section">
            <div id="student-login" class="space-y-4 bg-gray-50 p-6 rounded-xl border">
                <h2 class="text-lg font-semibold text-gray-800">Student Details</h2>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="s-name" placeholder="Apna naam likhein" class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email ID</label>
                    <input type="email" id="s-email" placeholder="Apna email likhein" class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <button onclick="startExam()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition">Start Exam</button>
            </div>

            <div id="exam-quiz-box" class="hidden">
                <div class="flex justify-between items-center mb-4 bg-blue-50 p-3 rounded-lg">
                    <span id="q-timer" class="text-sm font-bold text-red-600">Time Left: 35s</span>
                    <span id="q-counter" class="text-sm font-semibold text-gray-700">Question 1 of N</span>
                </div>
                <div id="quiz-question-container" class="mb-6"></div>
                <div class="flex justify-between">
                    <button onclick="prevQuestion()" id="prev-btn" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg text-sm font-medium">Previous</button>
                    <button onclick="nextQuestion()" id="next-btn" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium">Next</button>
                </div>
            </div>

            <div id="exam-preview-box" class="hidden">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">Exam Preview & Summary</h2>
                <div id="preview-summary" class="mb-4 bg-gray-50 p-4 rounded-xl border max-h-60 overflow-y-auto text-sm"></div>
                <button onclick="submitExam()" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">Submit Exam & Send Score</button>
            </div>
        </div>

        <!-- 2. ADMIN SECTION -->
        <div id="admin-section" class="hidden">
            <!-- Admin Login Box -->
            <div id="admin-login-box" class="bg-gray-50 p-6 rounded-xl border space-y-4">
                <h2 class="text-lg font-semibold text-red-600">🔒 Admin Restricted Access</h2>
                <p class="text-xs text-gray-500">Kripya database me diye gaye credentials darj karein.</p>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Admin Username</label>
                    <input type="text" id="admin-user" placeholder="Username" class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-red-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Admin Password</label>
                    <input type="password" id="admin-pass" placeholder="Password" class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-red-400">
                </div>
                <button onclick="verifyAdminLogin()" class="w-full bg-red-600 text-white py-2.5 rounded-lg font-semibold hover:bg-red-700 transition">Login to Admin Panel</button>
            </div>

            <!-- Actual Admin Dashboard -->
            <div id="admin-dashboard" class="hidden space-y-4 bg-blue-50 p-4 rounded-xl border border-blue-200">
                <div class="flex justify-between items-center">
                    <h2 class="text-md font-semibold text-blue-900">Admin Dashboard: Bulk Upload</h2>
                    <button onclick="adminLogout()" class="text-xs bg-red-500 text-white px-3 py-1 rounded">Logout</button>
                </div>
                <textarea id="bulk-input" rows="8" class="w-full p-3 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-400 font-mono mb-3" placeholder="Paste questions here..."></textarea>
                <div class="flex gap-2">
                    <button onclick="uploadToDatabase()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 transition">Upload to Database</button>
                    <button onclick="clearDatabase()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-red-600 transition">Clear Database</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Web3Forms Form -->
    <form id="result-form" action="https://api.web3forms.com/submit" method="POST" class="hidden">
        <input type="hidden" name="access_key" value="5f6d33ed-57b5-4514-b700-f3217dd3088b">
        <input type="hidden" name="to_email" value="mmulti982@gmail.com">
        <input type="hidden" name="subject" value="CBT Exam Result Report">
        <input type="hidden" name="message" id="form-message-body">
    </form>

    <script>
        // === SUPABASE CREDENTIALS ===
        const SUPABASE_URL = 'https://rpuxwmvdclzupnicqvqz.supabase.co';
        const SUPABASE_ANON_KEY = 'Aapki_Supabase_Anon_Key_Yahan_Daalein'; // Apni key yahan daalein
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let questionsList = [];
        let currentIdx = 0;
        let studentAnswers = {};
        let studentInfo = { name: '', email: '' };
        let timerInterval = null;
        let timeLeft = 35;

        window.addEventListener('DOMContentLoaded', () => {
            fetchQuestionsFromDB();
        });

        function switchMode(mode) {
            if (mode === 'student') {
                document.getElementById('student-section').classList.remove('hidden');
                document.getElementById('admin-section').classList.add('hidden');
                document.getElementById('btn-student').className = "px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold shadow";
                document.getElementById('btn-admin').className = "px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-semibold";
            } else {
                document.getElementById('student-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                document.getElementById('btn-admin').className = "px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold shadow";
                document.getElementById('btn-student').className = "px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-semibold";
            }
        }

        // Verify Admin Login using table columns ('multi' and 'MultiRK12#00')
        async function verifyAdminLogin() {
            const user = document.getElementById('admin-user').value.trim();
            const pass = document.getElementById('admin-pass').value.trim();

            if (!user || !pass) {
                alert('Kripya Username aur Password bharein!');
                return;
            }

            const { data, error } = await _supabase
                .from('admin_users')
                .select('*')
                .eq('multi', user)
                .eq('MultiRK12#00', pass);

            if (error || !data || data.length === 0) {
                alert('Galat Username ya Password hai!');
                return;
            }

            // Login Success
            alert('Admin Login Successful!');
            document.getElementById('admin-login-box').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
        }

        function adminLogout() {
            document.getElementById('admin-user').value = '';
            document.getElementById('admin-pass').value = '';
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('admin-login-box').classList.remove('hidden');
        }

        async function fetchQuestionsFromDB() {
            const statusBar = document.getElementById('status-bar');
            statusBar.innerText = "Fetching questions from secure database...";

            const { data, error } = await _supabase.from('exam_questions').select('*');
            if (error) {
                statusBar.innerText = "Database connection error!";
                return;
            }

            if (data && data.length > 0) {
                questionsList = data;
                statusBar.innerText = `Total ${data.length} questions loaded securely!`;
            } else {
                statusBar.innerText = "Database mein koi question nahi hai.";
            }
        }

        async function uploadToDatabase() {
            const rawText = document.getElementById('bulk-input').value.trim();
            if (!rawText) {
                alert('Kripya questions paste karein!');
                return;
            }

            const sampleQ = {
                question_text: rawText,
                option_a: "Option A",
                option_b: "Option B",
                option_c: "Option C",
                option_d: "Option D",
                correct_answer: "A"
            };

            const { error } = await _supabase.from('exam_questions').insert([sampleQ]);
            if (error) {
                alert('Upload failed: ' + error.message);
            } else {
                alert('Questions successfully uploaded!');
                document.getElementById('bulk-input').value = '';
                fetchQuestionsFromDB();
            }
        }

        async function clearDatabase() {
            if (!confirm("Saare questions delete karna chahte hain?")) return;
            const { error } = await _supabase.from('exam_questions').delete().neq('id', 0);
            if (error) alert('Error: ' + error.message);
            else { alert('Database cleared!'); fetchQuestionsFromDB(); }
        }

        function startExam() {
            const name = document.getElementById('s-name').value.trim();
            const email = document.getElementById('s-email').value.trim();
            if (!name || !email) {
                alert('Kripya apna Naam aur Email bharein!');
                return;
            }
            if (questionsList.length === 0) {
                alert('Database mein abhi koi questions uplabdh nahi hain!');
                return;
            }

            studentInfo = { name, email };
            document.getElementById('student-login').classList.add('hidden');
            document.getElementById('exam-quiz-box').classList.remove('hidden');
            currentIdx = 0;
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timerInterval);
            if (currentIdx >= questionsList.length) {
                showPreview();
                return;
            }

            timeLeft = 35;
            document.getElementById('q-timer').innerText = `Time Left: ${timeLeft}s`;
            document.getElementById('q-counter').innerText = `Question ${currentIdx + 1} of ${questionsList.length}`;

            const q = questionsList[currentIdx];
            const container = document.getElementById('quiz-question-container');
            
            container.innerHTML = `
                <p class="font-semibold text-gray-900 mb-3">${currentIdx + 1}. ${q.question_text}</p>
                <div class="space-y-2 text-sm">
                    <label class="block p-3 border rounded-lg cursor-pointer hover:bg-blue-50"><input type="radio" name="option" value="A" ${studentAnswers[currentIdx] === 'A' ? 'checked' : ''} onchange="saveAnswer('A')"> A) ${q.option_a}</label>
                    <label class="block p-3 border rounded-lg cursor-pointer hover:bg-blue-50"><input type="radio" name="option" value="B" ${studentAnswers[currentIdx] === 'B' ? 'checked' : ''} onchange="saveAnswer('B')"> B) ${q.option_b}</label>
                    <label class="block p-3 border rounded-lg cursor-pointer hover:bg-blue-50"><input type="radio" name="option" value="C" ${studentAnswers[currentIdx] === 'C' ? 'checked' : ''} onchange="saveAnswer('C')"> C) ${q.option_c}</label>
                    <label class="block p-3 border rounded-lg cursor-pointer hover:bg-blue-50"><input type="radio" name="option" value="D" ${studentAnswers[currentIdx] === 'D' ? 'checked' : ''} onchange="saveAnswer('D')"> D) ${q.option_d}</label>
                </div>
            `;

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('q-timer').innerText = `Time Left: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    nextQuestion();
                }
            }, 1000);
        }

        function saveAnswer(ans) {
            studentAnswers[currentIdx] = ans;
        }

        function nextQuestion() {
            currentIdx++;
            loadQuestion();
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function showPreview() {
            clearInterval(timerInterval);
            document.getElementById('exam-quiz-box').classList.add('hidden');
            document.getElementById('exam-preview-box').classList.remove('hidden');

            let summaryHtml = `<p class="font-medium mb-2">Student: ${studentInfo.name} (${studentInfo.email})</p>`;
            questionsList.forEach((q, idx) => {
                summaryHtml += `<p class="text-xs text-gray-600 mb-1">Q${idx + 1}: Answered - <b>${studentAnswers[idx] || 'Not Answered'}</b></p>`;
            });
            document.getElementById('preview-summary').innerHTML = summaryHtml;
        }

        function submitExam() {
            let correctCount = 0;
            let incorrectCount = 0;

            questionsList.forEach((q, idx) => {
                if (studentAnswers[idx] === q.correct_answer) {
                    correctCount++;
                } else {
                    incorrectCount++;
                }
            });

            const reportMessage = `Exam Result Report:\nStudent Name: ${studentInfo.name}\nEmail: ${studentInfo.email}\nTotal Questions: ${questionsList.length}\nCorrect: ${correctCount}\nIncorrect/Unanswered: ${incorrectCount}`;
            document.getElementById('form-message-body').value = reportMessage;

            document.getElementById('result-form').submit();
            alert('Exam submitted successfully! Result report sent to mmulti982@gmail.com');
        }
    </script>
</body>
</html>
